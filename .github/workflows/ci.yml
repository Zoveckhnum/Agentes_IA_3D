name: StackBI CI
on:
  pull_request:
  push:
    branches: [main, feat/sql-local, feat/cicd-iis-pilot, feat/auto-loop-memoria]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stackbi-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-build:
    name: Tests, SQL TLS and immutable build
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      CORE_DB_SERVER: sql.stackbi.com.mx
      CORE_DB_PORT: '1433'
      CORE_DB_NAME: AgentesIA3D
      CORE_DB_ODBC_DRIVER: ODBC Driver 18 for SQL Server
      CORE_DB_TRUSTED_CONNECTION: 'true'
      CORE_DB_ENCRYPT: 'true'
      CORE_DB_TRUST_SERVER_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12.0
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci --prefix app
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix motor --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix deploy/motor-runtime --ignore-scripts
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix server --omit=dev
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify unit contracts and role bundles
        run: node tools/ci/checks.mjs --unit-only
      - name: Prepare disposable SQL with certificate validation
        shell: powershell
        run: .\tools\ci\Install-CiSql.ps1
      - name: Test roles, unit contracts, real SQL integration and build
        run: node tools/ci/checks.mjs --integration-build
      - name: Package the exact Windows runtime and compiled frontend
        run: node tools/ci/package.mjs
      - name: Publish immutable candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stackbi-app-${{ github.sha }}
          path: .local/ci-artifacts/stackbi-${{ github.sha }}.zip
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
